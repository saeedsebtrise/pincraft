name: Pinterest Autopilot
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, publish]
        default: preview
      article_url:
        description: Article URL for preview only
        type: string
        required: false
      pins:
        description: How many different Pins of the article to preview (1-5)
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '3'
permissions:
  contents: read
concurrency:
  group: pinterest-autopilot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: autopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Only the worker's own checks gate a run; the whole app suite runs in Quality checks
      # on every push, so an unrelated app test can't hold up publishing.
      - run: npx vitest run src/test/autopilotQueue.test.ts
      - run: npx vitest run src/test/autopilotRunner.test.ts
      - run: npm run test:autopilot
      - run: node autopilot/run.mjs
        env:
          AUTOPILOT_MODE: ${{ inputs.mode }}
          AUTOPILOT_PREVIEW_URL: ${{ inputs.article_url }}
          AUTOPILOT_PREVIEW_PINS: ${{ inputs.pins }}
          AUTOPILOT_ENABLED: ${{ vars.AUTOPILOT_ENABLED }}
          AUTOPILOT_BOARDS_JSON: ${{ vars.AUTOPILOT_BOARDS_JSON }}
          AUTOPILOT_TEMPLATE: ${{ vars.AUTOPILOT_TEMPLATE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTOPILOT_SHEET_URL: ${{ secrets.AUTOPILOT_SHEET_URL }}
          AUTOPILOT_SHEET_SECRET: ${{ secrets.AUTOPILOT_SHEET_SECRET }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_API_KEY: ${{ secrets.MAKE_WEBHOOK_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'preview' && success()
        with:
          name: autopilot-preview
          path: output/autopilot/
          retention-days: 3
